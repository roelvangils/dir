name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install zsh and eza (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh
          # eza is not in the default apt repos; take it from the release tarball.
          EZA_VERSION=v0.23.5
          curl -fsSL "https://github.com/eza-community/eza/releases/download/${EZA_VERSION}/eza_x86_64-unknown-linux-gnu.tar.gz" \
            | sudo tar xz -C /usr/local/bin ./eza

      - name: Install zsh and eza (macOS)
        if: runner.os == 'macOS'
        run: brew install zsh eza

      - name: Syntax check
        run: |
          zsh -n dir
          zsh -n test.zsh
          zsh -n bench.zsh

      - name: Test
        run: zsh ./test.zsh
